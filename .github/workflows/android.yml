# Builds the NewChem Android app (a Trusted Web Activity around https://morsy515a.github.io/newchem/).
# The APK comes out unsigned (pushed to the 'android-build' branch); it is signed outside GitHub with the company's private key,
# whose fingerprint is published in https://morsy515a.github.io/.well-known/assetlinks.json
name: Android app

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version code (raise it for every new APK)'
        default: '1'
      version_name:
        description: 'Version name'
        default: '1.0'
  push:
    branches: [main]
    paths: ['.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PKG: io.github.morsy515a.newchem
      HOST: morsy515a.github.io
      START_URL: https://morsy515a.github.io/newchem/
      VCODE: ${{ github.event.inputs.version_code || '1' }}
      VNAME: ${{ github.event.inputs.version_name || '1.0' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Write the Android project
        run: |
          set -e
          R=twa/app/src/main/res
          mkdir -p $R/values $R/xml $R/drawable $R/mipmap-anydpi-v26

          cat > twa/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'newchem'
          include ':app'
          EOF

          cat > twa/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF

          cat > twa/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > twa/app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
              namespace '$PKG'
              compileSdk 34
              defaultConfig {
                  applicationId '$PKG'
                  minSdk 21
                  targetSdk 34
                  versionCode $VCODE
                  versionName '$VNAME'
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              lint { checkReleaseBuilds false; abortOnError false }
          }
          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          EOF

          cat > twa/app/src/main/AndroidManifest.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Translucent.NoTitleBar">
              <meta-data android:name="asset_statements" android:resource="@string/asset_statements" />
              <activity
                  android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                  android:label="@string/app_name"
                  android:exported="true">
                <meta-data android:name="android.support.customtabs.trusted.DEFAULT_URL" android:value="$START_URL" />
                <meta-data android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR" android:resource="@color/bar" />
                <meta-data android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR_DARK" android:resource="@color/barDark" />
                <meta-data android:name="android.support.customtabs.trusted.NAVIGATION_BAR_COLOR" android:resource="@color/bar" />
                <meta-data android:name="android.support.customtabs.trusted.NAVIGATION_BAR_COLOR_DARK" android:resource="@color/barDark" />
                <meta-data android:name="android.support.customtabs.trusted.SCREEN_ORIENTATION" android:value="portrait" />
                <meta-data android:name="android.support.customtabs.trusted.SPLASH_IMAGE_DRAWABLE" android:resource="@drawable/splash" />
                <meta-data android:name="android.support.customtabs.trusted.SPLASH_SCREEN_BACKGROUND_COLOR" android:resource="@color/splash" />
                <meta-data android:name="android.support.customtabs.trusted.SPLASH_SCREEN_FADE_OUT_DURATION" android:value="300" />
                <meta-data android:name="android.support.customtabs.trusted.FILE_PROVIDER_AUTHORITY" android:value="$PKG.fileprovider" />
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
                <intent-filter android:autoVerify="true">
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="https" android:host="$HOST" android:pathPrefix="/newchem" />
                </intent-filter>
              </activity>
              <activity android:name="com.google.androidbrowserhelper.trusted.FocusActivity" />
              <provider
                  android:name="androidx.core.content.FileProvider"
                  android:authorities="$PKG.fileprovider"
                  android:grantUriPermissions="true"
                  android:exported="false">
                <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/filepaths" />
              </provider>
              <service
                  android:name="com.google.androidbrowserhelper.trusted.DelegationService"
                  android:enabled="true"
                  android:exported="true"
                  tools:ignore="ExportedService">
                <intent-filter>
                  <action android:name="android.support.customtabs.trusted.TRUSTED_WEB_ACTIVITY_SERVICE" />
                  <category android:name="android.intent.category.DEFAULT" />
                </intent-filter>
              </service>
            </application>
            <queries>
              <intent>
                <action android:name="android.support.customtabs.action.CustomTabsService" />
              </intent>
            </queries>
          </manifest>
          EOF

          cat > $R/values/strings.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">نيوكيم</string>
            <string name="asset_statements" translatable="false">[{\"relation\": [\"delegate_permission/common.handle_all_urls\"], \"target\": {\"namespace\": \"web\", \"site\": \"https://$HOST\"}}]</string>
          </resources>
          EOF

          cat > $R/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="bar">#EFF3F1</color>
            <color name="barDark">#0E1A17</color>
            <color name="splash">#FFFFFF</color>
            <color name="iconBg">#FFFFFF</color>
          </resources>
          EOF

          cat > $R/xml/filepaths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
            <files-path path="twa_splash/" name="twa_splash" />
          </paths>
          EOF

          cat > $R/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/iconBg" />
            <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

      - name: Make the icons and splash from the app logo
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'EOF'
          import os
          from PIL import Image
          R = 'twa/app/src/main/res'
          logo = Image.open('icon-512.png').convert('RGBA')
          for name, s in {'mdpi': 1, 'hdpi': 1.5, 'xhdpi': 2, 'xxhdpi': 3, 'xxxhdpi': 4}.items():
              d = f'{R}/mipmap-{name}'
              os.makedirs(d, exist_ok=True)
              n = round(48 * s)
              logo.resize((n, n), Image.LANCZOS).save(f'{d}/ic_launcher.png')
              fg = round(108 * s)
              layer = Image.new('RGBA', (fg, fg), (0, 0, 0, 0))
              b = round(fg * 0.66)
              layer.paste(logo.resize((b, b), Image.LANCZOS), ((fg - b) // 2, (fg - b) // 2))
              layer.save(f'{d}/ic_launcher_foreground.png')
          logo.resize((288, 288), Image.LANCZOS).save(f'{R}/drawable/splash.png')
          EOF

      - name: Build
        working-directory: twa
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect
        run: |
          set -e
          mkdir out
          cp twa/app/build/outputs/apk/release/app-release-unsigned.apk out/newchem-unsigned.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          cp $BT/lib/apksigner.jar out/
          $BT/zipalign -c -v 4 out/newchem-unsigned.apk | tail -3 || true
          $BT/aapt2 dump badging out/newchem-unsigned.apk | head -5 || true

      # the unsigned APK goes to the 'android-build' branch, where the signing step picks it up
      - name: Hand over for signing
        working-directory: out
        run: |
          git init -q -b android-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Unsigned NewChem Android build ${{ github.run_number }} (version $VNAME / $VCODE) from ${{ github.sha }}" > BUILD.txt
          git add -A
          git commit -qm "Unsigned Android build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-build
