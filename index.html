<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نيوكيم</title>
<meta name="description" content="دفتر عملاء نيوكيم: الأرقام واللوكيشن والمديونية والمنتجات بأسعارها.">
<meta name="application-name" content="نيوكيم">
<meta name="apple-mobile-web-app-title" content="نيوكيم">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#EFF3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1A17" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>try{var nl=JSON.parse(localStorage.getItem('newchem.lock')||'{}');if(nl&&nl.enabled)document.documentElement.classList.add('locked')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: phone-first customer ledger. Sticky search bar, list with one-tap call/WhatsApp, customer sheet that slides over on phones (side pane on wide screens), thumb-reach add button. Data lives on the device. */
/* Palette from the New Chem logo: brand = the C's deep green (act / save / identity), accent = the N's blue (go / info), ink = the navy ring. */
:root{
  --bg:#EFF3F1;
  --surface:#FFFFFF;
  --sunken:#E4EBE8;
  --ink:#16242E;
  --muted:#596A72;
  --line:#D4DEDB;
  --brand:#1A7A3C;
  --brand-ink:#FFFFFF;
  --brand-soft:#E1F0D9;
  --brand-mid:#7FBE3C;
  --accent:#155DAA;
  --accent-ink:#FFFFFF;
  --accent-soft:#DCE9F6;
  --debt:#B0382C;
  --debt-soft:#F8E5E2;
  --clear:#1E774A;
  --clear-soft:#E0F0E6;
  --ex:#7C5E0C;
  --ex-soft:#F5EDD3;
  --scrim:rgba(6,22,28,.5);
  --shadow:0 6px 20px rgba(14,41,48,.22);
  --toast-bg:#16242E;
  --toast-fg:#F2F7F8;
  --font-ui:"Readex Pro","SF Arabic","Geeza Pro","Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --font-brand:"Reem Kufi","Readex Pro","SF Arabic","Geeza Pro","Noto Kufi Arabic",Tahoma,sans-serif;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1A17; --surface:#15241F; --sunken:#1B2E28; --ink:#E4EEEA; --muted:#8FA59C; --line:#253A32;
    --brand:#7CC46A; --brand-ink:#0B1A10; --brand-soft:#1D3A24; --brand-mid:#9BD45E;
    --accent:#6AB0EA; --accent-ink:#071A26; --accent-soft:#173A57;
    --debt:#F0806F; --debt-soft:#3A1D1A; --clear:#5CC48C; --clear-soft:#12321F;
    --ex:#E2C46A; --ex-soft:#34290D; --scrim:rgba(0,0,0,.6); --shadow:0 6px 20px rgba(0,0,0,.5);
    --toast-bg:#E4EEEA; --toast-fg:#0E1A17;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior-y:none}
html{background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
html.lock-s body{overflow:hidden}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;flex:none}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin-inline:auto}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted);margin:0;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-inner{padding-block:14px 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.topbar-inner > *,.layout > *,.d-card > *,.sheet-body > *{min-width:0}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{width:42px;height:42px;flex:none;display:block;border-radius:50%}
.brand-name{font-family:var(--font-brand);font-size:27px;font-weight:700;line-height:1;margin:0;color:var(--brand)}
.brand-sub{font-size:12.5px;color:var(--muted);margin-top:5px;display:flex;gap:8px;align-items:baseline}
.brand-sub .latin{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--brand);font-weight:600}
.top-acts{display:flex;gap:8px;align-items:center}
.search{position:relative}
.search svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:48px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding-inline:44px 14px;font-size:16px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:34px;padding-inline:14px;border-radius:17px;border:1px solid var(--line);background:var(--surface);font-size:14px;cursor:pointer;flex:none}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.sort{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex:none}
.sort select{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding-inline:8px;font-size:14px;color:var(--ink)}

/* ---------- buttons ---------- */
.btn{height:42px;padding-inline:16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover,.btn:active{background:var(--sunken)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover,.btn.primary:active{background:var(--brand);filter:brightness(1.07)}
.btn.danger{background:var(--debt);border-color:var(--debt);color:var(--surface)}
.btn.danger-ghost{color:var(--debt)}
.btn:disabled{opacity:.55;cursor:default}
.icon-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-grid;place-items:center;flex:none;color:var(--ink)}
.icon-btn:hover,.icon-btn:active{background:var(--sunken)}
.mini{height:36px;padding-inline:12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.mini:hover,.mini:active{background:var(--sunken)}
.mini.strong{border-color:var(--accent);color:var(--accent)}
.mini svg.i{width:17px;height:17px}
.fab{display:none}

/* ---------- layout ---------- */
.layout{padding-block:16px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
.list-pane{display:grid;gap:12px;min-width:0}
.detail-pane{min-width:0}
.stats{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13.5px;color:var(--muted)}
.stats b{color:var(--ink);font-weight:600}
.stats .res b{color:var(--accent)}
#banners{display:grid;gap:8px}
#banners:empty{display:none}
.note{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:var(--r);font-size:13.5px;background:var(--ex-soft);color:var(--ex)}
.note.info{background:var(--accent-soft);color:var(--ink)}
.note.bad{background:var(--debt-soft);color:var(--debt)}
.note .mini{background:transparent;border-color:currentColor;color:inherit}
.note > span:first-child{flex:1 1 220px;min-width:0}
.note-acts{display:flex;gap:6px;align-items:center;flex:none}
.note .x{width:32px;height:32px;padding:0;justify-content:center;border:0}
.note span svg{width:16px;height:16px;vertical-align:-3px}

.psum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.psum h4{margin:0;font-size:12px;font-weight:500;color:var(--muted)}
.psum-row{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;font-size:14px}
.psum-row b{font-weight:600}
.psum-row span{color:var(--muted)}
.psum-row .price{color:var(--accent);font-weight:600}

/* list rows: the whole row opens the customer; the call / WhatsApp buttons sit above that layer */
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:hover,.row:active{background:var(--sunken)}
.row.sel{background:var(--brand-soft)}
.row-open{display:grid;gap:3px;min-width:0;padding:0;margin:0;border:0;background:none;text-align:start;cursor:pointer}
.row-open::after{content:"";position:absolute;inset:0}
.row-open:focus-visible{outline:none}
.row-open:focus-visible::after{outline:2px solid var(--accent);outline-offset:-2px}
.row-end{position:relative;z-index:1;display:grid;justify-items:end;gap:6px;pointer-events:none}
.qa{display:flex;gap:6px;pointer-events:auto}
.qbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--accent);text-decoration:none}
.qbtn.wa{color:var(--clear)}
.qbtn:active{background:var(--sunken)}
.qbtn svg.i{width:18px;height:18px}
.hex{width:40px;height:46px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--brand-soft);color:var(--brand);font-family:var(--font-brand);font-weight:700;font-size:18px;flex:none}
.row.sel .hex{background:var(--brand);color:var(--brand-ink)}
.hex.lg{width:54px;height:62px;font-size:24px}
.row-name{font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:0 6px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chip{font-size:12px;padding:1px 8px;border-radius:6px;background:var(--sunken);color:var(--muted)}
.chip.hit{background:var(--accent-soft);color:var(--ink);font-weight:500}
.chip.hit .num{color:var(--accent);font-weight:600}
.ex-tag{display:inline-block;font-size:10.5px;font-weight:600;background:var(--ex-soft);color:var(--ex);padding:0 6px;border-radius:5px;margin-inline-start:6px;vertical-align:2px;line-height:1.7}
.pill{font-size:13px;padding:4px 10px;border-radius:8px;text-align:center;white-space:nowrap;font-weight:600;line-height:1.35}
.pill-l{display:block;font-size:10.5px;font-weight:500;opacity:.85}
.is-debt{color:var(--debt)} .pill.is-debt{background:var(--debt-soft)}
.is-clear{color:var(--clear)} .pill.is-clear{background:var(--clear-soft)}
.is-credit{color:var(--accent)} .pill.is-credit{background:var(--accent-soft)}
.state{padding:28px 18px;text-align:center;color:var(--muted);font-size:14.5px}
.state b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.state .btn{margin-top:14px}

/* ---------- customer sheet ---------- */
.detail-empty{border:1px dashed var(--line);border-radius:12px;padding:40px 24px;text-align:center;color:var(--muted);display:grid;justify-items:center;gap:10px}
.detail-empty img{width:76px;height:76px;opacity:.4;filter:grayscale(1)}
.d-top,.d-bar{display:none}
.d-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:22px}
.d-head{display:grid;gap:14px}
.d-id{display:flex;align-items:center;gap:14px;min-width:0}
.d-id-text{min-width:0}
.d-name{font-family:var(--font-brand);font-size:25px;font-weight:700;line-height:1.3;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.d-meta{font-size:13px;color:var(--muted);margin-top:2px}
.d-actions{display:flex;gap:8px;flex-wrap:wrap}
.confirm{display:grid;gap:10px;padding:12px 14px;border-radius:var(--r);background:var(--debt-soft);color:var(--debt);font-size:14px}
.confirm.neutral{background:var(--accent-soft);color:var(--ink)}
.confirm-btns{display:flex;gap:8px;flex-wrap:wrap}
.d-debt{border-radius:12px;padding:16px;display:grid;gap:10px;background:var(--sunken)}
.d-debt.is-debt{background:var(--debt-soft)}
.d-debt.is-clear{background:var(--clear-soft)}
.d-debt.is-credit{background:var(--accent-soft)}
.d-debt-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.d-state{font-weight:600}
.d-debt.is-debt .d-state{color:var(--debt)} .d-debt.is-clear .d-state{color:var(--clear)} .d-debt.is-credit .d-state{color:var(--accent)}
.d-amt{font-size:38px;font-weight:600;line-height:1.1;color:var(--ink);display:flex;align-items:baseline;gap:8px}
.d-amt small{font-size:15px;font-weight:500;color:var(--muted)}
.pay{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.pay-in{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:8px}
.pay-btns{display:flex;gap:8px;flex-wrap:wrap}
.pay-btns .btn{flex:1 1 140px;height:46px}
.pay-btn{color:var(--clear)}
.charge-btn{color:var(--debt)}
.pay-err{margin:0;font-size:13px;color:var(--debt)}
.d-sec{display:grid;gap:10px}
.d-sec h3{margin:0;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:center}
.d-sec h3 .count{background:var(--sunken);color:var(--ink);border-radius:6px;padding:0 7px;font-size:11.5px}
.ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px}
.ph-num{font-size:20px;font-weight:500;direction:ltr;unicode-bidi:isolate;user-select:all;-webkit-user-select:all}
.ph-acts{display:flex;gap:6px;flex-wrap:wrap}
.addr{margin:0;font-size:15px}
.route{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px;border-radius:12px;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.route:active{filter:brightness(1.08)}
.route-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22)}
.route-ic svg.i{width:22px;height:22px}
.route-txt{display:grid;gap:2px;min-width:0}
.route-txt b{font-size:16.5px;font-weight:600}
.route-txt span{font-size:13.5px;opacity:.92;overflow-wrap:anywhere}
.route-go{font-size:26px;line-height:1;font-weight:300}
.route.soft{background:var(--accent-soft);color:var(--ink)}
.route.soft .route-ic{background:var(--surface);color:var(--accent)}
.loc-note{margin:0;font-size:13px;color:var(--muted)}
.loc-note.ok{color:var(--clear)}
.loc-note.warn{color:var(--ex)}
.loc-acts{display:flex;flex-wrap:wrap;gap:6px}
.locf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.locf .btn{height:46px}
.loc-status{font-size:12.5px;color:var(--clear);display:flex;gap:4px 10px;align-items:center;flex-wrap:wrap}
.loc-status button{border:0;background:none;color:var(--debt);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:0}
.tscroll{overflow-x:auto}
.ptable{width:100%;border-collapse:collapse;font-size:14.5px}
.ptable th{font-size:12px;font-weight:500;color:var(--muted);text-align:start;padding:6px 8px;border-bottom:1px solid var(--line)}
.ptable td{padding:10px 8px;border-bottom:1px solid var(--line)}
.ptable tr:last-child td{border-bottom:0}
.ptable td.price{font-weight:600;white-space:nowrap}
.ptable tr.hit td{background:var(--accent-soft)}
.notes{margin:0;white-space:pre-wrap;font-size:14.5px}
.hist{list-style:none;margin:0;padding:0;display:grid}
.hist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist li:last-child{border-bottom:0}
.h-main{display:flex;flex-wrap:wrap;gap:0 8px;min-width:0}
.h-type{font-weight:500}
.h-note{color:var(--muted);overflow-wrap:anywhere}
.h-amt{font-weight:600;direction:ltr;unicode-bidi:isolate}
.h-side{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:0 12px;font-size:12px;color:var(--muted)}

@media (min-width:920px){
  .layout{grid-template-columns:minmax(0,420px) minmax(0,1fr)}
  .detail-pane{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,160px) + 16px);max-height:calc(100dvh - var(--hdr,160px) - 32px - env(safe-area-inset-top,0px));overflow:auto;border-radius:14px}
}

/* ---------- phone ---------- */
@media (max-width:919.98px){
  html.lock-d body{overflow:hidden}
  #add-btn{display:none}
  .fab{display:inline-flex;align-items:center;gap:8px;position:fixed;z-index:30;left:calc(env(safe-area-inset-left,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);height:56px;padding-inline:22px;border-radius:28px;border:0;background:var(--brand);color:var(--brand-ink);font-weight:600;font-size:16px;box-shadow:var(--shadow);cursor:pointer}
  .fab:active{filter:brightness(1.08)}
  .layout{padding-block:12px 112px}
  .detail-pane{display:none}
  .app.detail-open .detail-pane{display:block;position:fixed;inset:0;z-index:40;overflow:auto;overscroll-behavior:contain;background:var(--bg);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .d-top{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:3;background:var(--bg);padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:8px}
  .d-top-t{font-weight:600;font-size:16px}
  .d-card{background:transparent;border:0;padding:4px 4px 0;gap:24px}
  .d-actions .btn{flex:1 1 0}
  .d-bar{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  .bar-btn{display:grid;justify-items:center;align-content:center;gap:2px;min-height:56px;padding:4px;border:0;border-radius:12px;background:none;color:var(--ink);font-size:12.5px;font-weight:500;text-decoration:none;cursor:pointer}
  .bar-btn:active{background:var(--sunken)}
  .bar-btn svg.i{width:23px;height:23px}
  .bar-btn.call svg{color:var(--accent)}
  .bar-btn.wa svg{color:var(--clear)}
  .bar-btn.nav svg{color:var(--accent)}
  .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 92px)}
}
@media (max-width:600px){
  .topbar-inner{padding-block:10px;gap:10px}
  .brand-logo{width:36px;height:36px}
  .brand-name{font-size:23px}
  .brand-sub{margin-top:3px}
  .tools{flex-wrap:nowrap}
  .seg{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 auto}
  .seg::-webkit-scrollbar{display:none}
  .seg{gap:4px}
  .seg button{padding-inline:10px;font-size:13.5px}
  .sort select{max-width:108px}
  .sort-l{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .row{padding:12px;gap:10px}
  .hex{width:38px;height:44px;font-size:17px}
  .pay-in{grid-template-columns:minmax(0,1fr)}
  .d-amt{font-size:36px}
}
@media (max-width:380px){
  .seg button{padding-inline:8px}
}

/* ---------- sheets (form + menu) ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-back{position:absolute;inset:0;background:var(--scrim)}
.sheet-panel{position:relative;width:100%;max-width:660px;max-height:100%;overflow:auto;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column}
.sheet-panel.narrow{max-width:520px}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px 12px;padding-inline:20px}
.sheet-head h2{margin:0;font-family:var(--font-brand);font-size:22px;font-weight:700}
.sheet-body{flex:1 0 auto;display:grid;gap:16px;align-content:start;padding-block:16px 20px;padding-inline:20px}
.sheet-foot{position:sticky;bottom:0;z-index:2;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;padding-block:12px;padding-inline:20px}
.sheet-foot .btn{min-width:120px;height:48px;font-size:16px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f{display:grid;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f > span{font-size:13px;color:var(--muted)}
.f input,.f textarea,.prow input,.pay input{width:100%;height:46px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding-inline:12px;font-size:16px;-webkit-appearance:none;appearance:none}
.f textarea{height:auto;padding-block:10px;resize:vertical}
input[dir="ltr"]{text-align:right}
.f input:focus,.f textarea:focus,.prow input:focus,.pay input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:12.5px;color:var(--ex)}
.prods{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0;display:grid;gap:10px;min-width:0}
.prods legend{font-size:13px;color:var(--muted);padding-inline:6px}
#prod-rows{display:grid;gap:10px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 104px 104px 44px;gap:8px}
.add-prod{justify-self:start}
.f-err{margin:0;color:var(--debt);font-size:14px}

.m-sec{display:grid;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.m-sec:last-child{border-bottom:0;padding-bottom:0}
.m-sec h3{margin:0;font-size:15px;font-weight:600}
.m-sec p{margin:0;font-size:14px;color:var(--muted)}
.m-sec .btns{display:flex;gap:8px;flex-wrap:wrap}
.m-sec .btns .btn{flex:1 1 180px}
.m-steps{margin:0;padding-inline-start:20px;display:grid;gap:4px;font-size:14px}
.m-ok{font-weight:600;color:var(--clear)}
.m-ver{font-size:12px;color:var(--muted)}

@media (max-width:600px){
  .sheet{padding:0}
  .sheet-back{display:none}
  .sheet-panel,.sheet-panel.narrow{max-width:none;height:100%;max-height:none;border:0;border-radius:0}
  .sheet-head{padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .sheet-body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
  .sheet-foot{padding-top:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .sheet-foot .btn{flex:1 1 0;min-width:0}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .prow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
  .prow input:first-child{grid-column:1/-1}
}
/* when the app runs from the home screen, the form's own footer carries the bottom inset */
@media (max-width:600px){ #form .sheet-body{padding-bottom:20px} }

/* ---------- app lock ---------- */
html.locked .app{visibility:hidden}
html.locked body{overflow:hidden}
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;overflow:auto;padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lock-in{width:100%;max-width:330px;display:grid;justify-items:center;gap:8px;text-align:center}
.lock-logo{width:84px;height:84px;border-radius:50%}
.lock-t{margin:6px 0 0;font-family:var(--font-brand);font-size:25px;font-weight:700;color:var(--brand)}
.lock-sub{margin:0;color:var(--muted);font-size:14.5px}
.dots{display:flex;gap:14px;direction:ltr;min-height:18px;margin-top:10px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.dot.on{background:var(--ink);border-color:var(--ink)}
.dots.shake{animation:nc-shake .35s}
@keyframes nc-shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@media (prefers-reduced-motion: reduce){.dots.shake{animation:none}}
.lock-err{min-height:1.6em;margin:0;color:var(--debt);font-size:13.5px}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 24px;direction:ltr}
.key{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:27px;font-weight:500;color:var(--ink);cursor:pointer;display:grid;place-items:center;font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none}
.key:active{background:var(--sunken)}
.key.ghost{border:0;background:none}
.key.bio{color:var(--brand);border-color:var(--brand)}
.key svg.i{width:28px;height:28px}
.key:disabled{opacity:.35;cursor:default}
.lock-link{border:0;background:none;color:var(--accent);font:inherit;font-size:14px;cursor:pointer;padding:8px 10px;margin-top:4px}
.lock-forgot{display:grid;gap:10px;padding:12px 14px;border-radius:var(--r);background:var(--debt-soft);color:var(--debt);font-size:14px;text-align:start;width:100%}
.lock-forgot.info{background:var(--accent-soft);color:var(--ink)}
@media (max-height:660px){.lock-logo{width:60px;height:60px}.pad{grid-template-columns:repeat(3,62px);gap:10px 20px}.key{width:62px;height:62px;font-size:24px}}
.lk-row{display:flex;align-items:center;gap:10px;font-size:14.5px;cursor:pointer}
.lk-row input{width:20px;height:20px;accent-color:var(--brand);flex:none}
.m-sec select{height:42px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding-inline:10px;font:inherit;font-size:15px;color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);z-index:60;pointer-events:none;background:var(--toast-bg);color:var(--toast-fg);padding:11px 18px;border-radius:12px;font-size:14.5px;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.toast.bad{background:var(--debt);color:var(--surface)}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar" id="topbar">
    <div class="gut">
      <div class="wrap topbar-inner">
        <div class="brand-row">
          <div class="brand">
            <img class="brand-logo" src="logo-mark.png" alt="" width="42" height="42" decoding="async">
            <div>
              <h1 class="brand-name">نيوكيم</h1>
              <div class="brand-sub"><span>دفتر العملاء</span><span class="latin">NewChem</span></div>
            </div>
          </div>
          <div class="top-acts">
            <button type="button" class="btn primary" id="add-btn" data-act="new">+ عميل جديد</button>
            <button type="button" class="icon-btn" id="lock-btn" data-act="lock-now" aria-label="اقفل التطبيق" hidden>
              <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            </button>
            <button type="button" class="icon-btn" data-act="menu" aria-label="الإعدادات والنسخة الاحتياطية">
              <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
          </div>
        </div>
        <div class="search" role="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <label class="sr" for="q">بحث</label>
          <input id="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="ابحث بالاسم أو الرقم أو المنتج">
        </div>
        <div class="tools">
          <div class="seg" id="seg" role="group" aria-label="البحث في">
            <button type="button" data-field="all" aria-pressed="true">الكل</button>
            <button type="button" data-field="name" aria-pressed="false">الاسم</button>
            <button type="button" data-field="phone" aria-pressed="false">الرقم</button>
            <button type="button" data-field="product" aria-pressed="false">المنتج</button>
          </div>
          <label class="sort" for="sort"><span class="sort-l">ترتيب</span>
            <select id="sort" aria-label="ترتيب العملاء">
              <option value="name">أبجدي</option>
              <option value="debt">الأعلى مديونية</option>
              <option value="recent">آخر تعديل</option>
            </select>
          </label>
        </div>
      </div>
    </div>
  </header>

  <div class="gut">
    <main class="wrap layout">
      <section class="list-pane" aria-label="العملاء">
        <div class="stats" id="stats" aria-live="polite"></div>
        <div id="banners"></div>
        <div id="psum"></div>
        <div class="list" id="list"></div>
      </section>
      <section class="detail-pane" id="detail" aria-live="polite"></section>
    </main>
  </div>

  <button type="button" class="fab" id="fab" data-act="new">
    <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>عميل جديد
  </button>

  <!-- customer form -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-back" data-act="close-form"></div>
    <form class="sheet-panel" id="form" novalidate role="dialog" aria-modal="true" aria-labelledby="form-title">
      <div class="sheet-head">
        <h2 id="form-title">عميل جديد</h2>
        <button type="button" class="icon-btn" data-act="close-form" aria-label="إغلاق">✕</button>
      </div>
      <div class="sheet-body">
        <div class="fgrid">
          <label class="f full"><span>اسم العميل *</span><input id="f-name" autocomplete="off" enterkeyhint="next" placeholder="مثلاً: محل الحمد للمنظفات"></label>
          <label class="f"><span>رقم الموبايل</span><input id="f-phone" type="tel" inputmode="tel" dir="ltr" autocomplete="off" enterkeyhint="next" placeholder="01xxxxxxxxx"><span class="hint" id="f-phone-hint" hidden></span></label>
          <label class="f"><span>رقم تاني (اختياري)</span><input id="f-phone2" type="tel" inputmode="tel" dir="ltr" autocomplete="off" enterkeyhint="next"></label>
          <label class="f"><span>المنطقة</span><input id="f-area" autocomplete="off" enterkeyhint="next"></label>
          <label class="f"><span>المديونية الحالية (ج.م)</span><input id="f-debt" inputmode="decimal" dir="ltr" autocomplete="off" enterkeyhint="next" placeholder="0"></label>
          <label class="f full"><span>العنوان بالتفصيل</span><input id="f-address" autocomplete="off" enterkeyhint="next"></label>
          <div class="f full"><span id="f-map-l">لوكيشن العميل: لينك جوجل ماب، أو دوس «مكاني الحالي» وانت عنده</span>
            <div class="locf">
              <input id="f-map" type="text" inputmode="url" dir="ltr" autocomplete="off" aria-labelledby="f-map-l" placeholder="https://maps.app.goo.gl/...">
              <button type="button" class="btn" id="here-form" data-act="here-form"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>مكاني الحالي</button>

        <fieldset class="prods">
          <legend>المنتجات اللي بياخدها وأسعارها</legend>
          <div id="prod-rows"></div>
          <button type="button" class="mini add-prod" data-act="add-prod">+ منتج تاني</button>
        </fieldset>
        <label class="f full"><span>ملاحظات</span><textarea id="f-notes" rows="2"></textarea></label>
        <p class="f-err" id="f-err" hidden></p>

    </form>
  </div>

  <!-- menu: backup + install -->

        <button type="button" class="icon-btn" data-act="close-menu" aria-label="إغلاق">✕</button>
      </div>
      <div class="sheet-body" id="menu-body"></div>
    </div>
  </div>

  <datalist id="dl-prods"></datalist>
  <datalist id="dl-units">

    <option value="شيكارة"></option><option value="كرتونة"></option><option value="برميل"></option><option value="طن"></option>
  </datalist>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<div class="lock" id="lock" hidden role="dialog" aria-modal="true" aria-labelledby="lock-t">
  <div class="lock-in">
    <img class="lock-logo" src="logo-mark.png" alt="" width="84" height="84">

      <button type="button" class="key" data-k="7">7</button><button type="button" class="key" data-k="8">8</button><button type="button" class="key" data-k="9">9</button>
      <button type="button" class="key bio" data-k="bio" id="key-bio" aria-label="افتح بالبصمة أو وش الموبايل"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg></button>
      <button type="button" class="key" data-k="0">0</button>
      <button type="button" class="key ghost" data-k="del" aria-label="امسح رقم"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-7 7 7 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="m16 9-6 6M10 9l6 6"/></svg></button>
    </div>
    <button type="button" class="lock-link" data-k="forgot">نسيت الرقم السري؟</button>
    <div id="lock-forgot" hidden></div>
  </div>
</div>

<script>
(function(){
'use strict';
var APP_VERSION='1.3';
var $ = function(s){ return document.querySelector(s); };
var app = $('#app');
var root = document.documentElement;

var S = { list:[], q:'', field:'all', sort:'name', sel:null, editingId:null, confirmDel:null, confirmHere:null, importData:null, updateReady:false };
var prodRows = [];
var busyLoc = false;
var formLoc = null;
var lastFocus = null;

function svg(p){ return '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'; }
var IC = {
  phone: svg('<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>'),
  chat: svg('<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/>'),

  edit: svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
  back: svg('<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>'),

  share: svg('<path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>'),

};

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
var AR='٠١٢٣٤٥٦٧٨٩', FA='۰۱۲۳۴۵۶۷۸۹';
function latin(s){ return String(s==null?'':s).replace(/[٠-٩]/g,function(d){return AR.indexOf(d);}).replace(/[۰-۹]/g,function(d){return FA.indexOf(d);}); }
function norm(s){ return latin(s).toLowerCase().replace(/[ً-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/\s+/g,' ').trim(); }
function digits(s){ return latin(s).replace(/\D/g,''); }
function num(s){ if(s==null) return NaN; if(typeof s==='number') return s; var t=latin(s).replace(/[,،\s]/g,'').replace('٫','.'); if(t==='') return NaN; var n=parseFloat(t); return isFinite(n)?n:NaN; }
function r2(n){ return Math.round(n*100)/100; }
function fmt(n){ return r2(+n||0).toLocaleString('en-US',{maximumFractionDigits:2}); }
function fmtDate(t){ if(!t) return ''; try{ return new Date(t).toLocaleDateString('ar-EG-u-nu-latn',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return ''; } }
function fmtPhone(p){ var d=digits(p); if(d.length===11 && d[0]==='0') return d.slice(0,4)+' '+d.slice(4,7)+' '+d.slice(7); return latin(p).trim(); }
function waNum(p){ var d=digits(p); if(!d) return ''; if(d.length===11 && d.indexOf('01')===0) return '2'+d; if(d.indexOf('00')===0) return d.slice(2); return d; }
/* location: exact coordinates beat a saved map link, which beats the written address */
function coordsFrom(s){
  s=latin(String(s||'')).replace(/٫/g,'.'); if(!s.trim()) return null;
  try{ s=decodeURIComponent(s); }catch(e){}
  var m = s.match(/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/)
       || s.match(/[?&](?:q|query|ll|destination|daddr|sll|center|coordinate)=(?:loc:)?\s*(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/i)
       || s.match(/@(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/)
       || s.match(/^\s*(-?\d{1,2}\.\d+)\s*[,،\s]\s*(-?\d{1,3}\.\d+)\s*$/);
  if(!m) return null;
  var lat=+m[1], lng=+m[2];
  if(!isFinite(lat)||!isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180) return null;
  return {lat:lat,lng:lng};
}
function hasCoords(c){ return typeof c.lat==='number' && typeof c.lng==='number' && isFinite(c.lat) && isFinite(c.lng); }
function addrOf(c){ return [c.address,c.area].filter(Boolean).join('، '); }
function locInfo(c){
  var p=hasCoords(c)?{lat:c.lat,lng:c.lng}:coordsFrom(c.mapUrl);
  var raw=String(c.mapUrl||'').trim(), link=/^https?:\/\//i.test(raw)?raw:'', addr=addrOf(c);
  var gm='https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=';
  if(p){
    var ll=p.lat.toFixed(6)+','+p.lng.toFixed(6);
    return {kind:'exact', route:gm+ll, pin:'https://www.google.com/maps/search/?api=1&query='+ll, waze:'https://waze.com/ul?ll='+ll+'&navigate=yes', addr:addr};
  }
  if(link) return {kind:'link', route:'', pin:link, addr:addr};
  if(addr) return {kind:'addr', route:gm+encodeURIComponent(addr), pin:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(addr), addr:addr};
  return {kind:'none', route:'', pin:'', addr:''};
}
function r6(n){ return Math.round(n*1e6)/1e6; }
function locate(){
  return new Promise(function(res,rej){
    if(!navigator.geolocation) return rej({code:'none'});
    navigator.geolocation.getCurrentPosition(function(p){
      res({lat:r6(p.coords.latitude),lng:r6(p.coords.longitude),acc:Math.round(p.coords.accuracy||0)});
    }, rej, {enableHighAccuracy:true,timeout:20000,maximumAge:0});
  });
}
function geoErr(e){
  var c=e&&e.code;
  if(c===1) toast('التطبيق محتاج إذن يعرف مكانك. اسمح بالموقع لنيوكيم من إعدادات الموبايل وجرّب تاني.',true);
  else if(c==='none') toast('الجهاز ده مش بيدعم تحديد المكان.',true);
  else toast('مقدرتش أحدد مكانك. اتأكد إن الـ GPS شغال وجرّب تاني.',true);
}
function accTxt(a){ return a>0?' · الدقة حوالي '+a+' متر':''; }
function initial(name){ var w=String(name||'').trim().replace(/^ال(?=\S\S)/,''); return w?w.charAt(0):'؟'; }
function phonesOf(c){ return [c.phone,c.phone2].filter(function(p){ return p && String(p).trim(); }); }
function debtInfo(v){ var d=+v||0; if(d>0) return {cls:'is-debt',label:'عليه',text:fmt(d)}; if(d<0) return {cls:'is-credit',label:'ليه',text:fmt(-d)}; return {cls:'is-clear',label:'خالص',text:''}; }
function priceTxt(p){ var pr=num(p.price); if(isNaN(pr)) return ''; return fmt(pr)+' ج.م'+(p.unit?' / '+esc(p.unit):''); }
function cur(){ return S.list.find(function(x){ return x.id===S.sel; }) || null; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function pad(n){ return (n<10?'0':'')+n; }
function daysAgo(t){ return Math.floor((Date.now()-t)/86400000); }
function agoTxt(t){ var d=daysAgo(t); if(d<=0) return 'النهارده'; if(d===1) return 'امبارح'; if(d===2) return 'من يومين'; if(d<=10) return 'من '+d+' أيام'; return 'من '+d+' يوم'; }

var KEY='newchem.v1', store={customers:{},meta:{}}, storageOK=true;
try{ localStorage.setItem('newchem.t','1'); localStorage.removeItem('newchem.t'); }catch(e){ storageOK=false; }
function load(){
  try{ var t=localStorage.getItem(KEY); if(t){ var o=JSON.parse(t); if(o && typeof o==='object'){ store.customers=o.customers&&typeof o.customers==='object'?o.customers:{}; store.meta=o.meta&&typeof o.meta==='object'?o.meta:{}; } } }catch(e){}
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(store)); return true; }
  catch(e){ toast(storageOK?'مقدرتش أحفظ. مساحة التخزين على الموبايل ممكن تكون مليانة.':'المتصفح ده مانع الحفظ. افتح التطبيق من الشاشة الرئيسية أو من متصفح عادي.',true); return false; }
}
function refresh(){
  S.list=Object.keys(store.customers).map(function(id){ return Object.assign({},store.customers[id],{id:id}); });
  render();
}
var persistAsked=false;
function askPersist(){
  if(persistAsked) return; persistAsked=true;
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){}); }catch(e){}
}
function put(id,doc){
  var had=Object.prototype.hasOwnProperty.call(store.customers,id), prev=store.customers[id];
  store.customers[id]=doc;
  if(!save()){ if(had) store.customers[id]=prev; else delete store.customers[id]; return false; }
  askPersist(); refresh(); return true;
}
function remove(id){
  var prev=store.customers[id]; delete store.customers[id];
  if(!save()){ store.customers[id]=prev; return false; }
  refresh(); return true;
}
function newId(){ return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
window.addEventListener('storage',function(e){ if(e.key===KEY){ load(); refresh(); } });

/* ---------- search ---------- */
function match(c){
  var q=S.q.trim(); if(!q) return {ok:true,hits:[]};
  var nq=norm(q), dq=digits(q);
  var name=norm(c.name).indexOf(nq)>-1;
  var phone=dq.length>=2 && phonesOf(c).some(function(p){ return digits(p).indexOf(dq)>-1; });
  var hits=(c.products||[]).filter(function(p){ return norm(p.name).indexOf(nq)>-1; });
  var place=norm((c.area||'')+' '+(c.address||'')).indexOf(nq)>-1;
  if(S.field==='name') return {ok:name,hits:[]};
  if(S.field==='phone') return {ok:phone,hits:[]};
  if(S.field==='product') return {ok:hits.length>0,hits:hits};
  return {ok:name||phone||hits.length>0||place,hits:hits};
}
function qHit(p){ var q=S.q.trim(); if(!q||S.field==='name'||S.field==='phone') return false; return norm(p.name).indexOf(norm(q))>-1; }
function sortRows(a){
  a=a.slice();
  if(S.sort==='debt') a.sort(function(x,y){ return (+y.c.debt||0)-(+x.c.debt||0); });
  else if(S.sort==='recent') a.sort(function(x,y){ return (y.c.updatedAt||0)-(x.c.updatedAt||0); });
  else a.sort(function(x,y){ return String(x.c.name||'').localeCompare(String(y.c.name||''),'ar'); });
  return a;
}

function syncControls(){

function backupDue(){
  var real=S.list.filter(function(c){ return !c.example; });
  if(!real.length) return false;
  var lb=store.meta.lastBackup;
  if(!lb){ var oldest=Math.min.apply(null,real.map(function(c){ return c.createdAt||Date.now(); })); return daysAgo(oldest)>=1; }
  return daysAgo(lb)>=7;
}

  $('#stats').innerHTML=h;
}
function productSummary(rows){
  if(!S.q.trim()||S.field==='name'||S.field==='phone') return '';
  var groups=new Map();
  rows.forEach(function(r){ r.m.hits.forEach(function(p){
    var k=norm(p.name); if(!groups.has(k)) groups.set(k,{name:p.name,prices:[],units:new Set(),n:0});
    var g=groups.get(k); g.n++; var pr=num(p.price); if(!isNaN(pr)) g.prices.push(pr); if(p.unit) g.units.add(p.unit);
  }); });
  if(!groups.size) return '';
  var out=[]; groups.forEach(function(g){
    var price='من غير سعر';
    if(g.prices.length){ var mn=Math.min.apply(null,g.prices), mx=Math.max.apply(null,g.prices); price = mn===mx ? fmt(mn)+' ج.م' : 'من '+fmt(mn)+' لـ '+fmt(mx)+' ج.م'; }
    var unit = g.units.size===1 ? ' / '+esc(Array.from(g.units)[0]) : '';
    out.push('<div class="psum-row"><b>'+esc(g.name)+'</b><span>'+g.n+' '+(g.n===1?'عميل':'عملاء')+'</span><span class="price num">'+price+unit+'</span></div>');
  });
  return '<div class="psum"><h4>أسعار المنتج عند العملاء</h4>'+out.slice(0,4).join('')+'</div>';
}
function rowHTML(r){
  var c=r.c, m=r.m, d=debtInfo(c.debt), prods=c.products||[], chips='';
  if(m.hits.length){
    chips=m.hits.slice(0,3).map(function(p){ var pt=priceTxt(p); return '<span class="chip hit">'+esc(p.name)+(pt?' · <span class="num">'+pt+'</span>':'')+'</span>'; }).join('');
  } else {
    chips=prods.slice(0,3).map(function(p){ return '<span class="chip">'+esc(p.name)+'</span>'; }).join('') + (prods.length>3?'<span class="chip">+'+(prods.length-3)+'</span>':'');
  }

  if(c.area) sub.push('<span>'+esc(c.area)+'</span>');

  if(ph){
    qa='<span class="qa"><a class="qbtn" href="tel:'+esc(digits(ph))+'" aria-label="اتصال">'+IC.phone+'</a>'+
       (wa?'<a class="qbtn wa" href="https://wa.me/'+esc(wa)+'" target="_blank" rel="noopener" aria-label="واتساب">'+IC.chat+'</a>':'')+'</span>';
  }
  return '<div class="row'+(S.sel===c.id?' sel':'')+'">'+
    '<span class="hex" aria-hidden="true">'+esc(initial(c.name))+'</span>'+
    '<button type="button" class="row-open" data-id="'+esc(c.id)+'">'+
      '<span class="row-name">'+esc(c.name||'بدون اسم')+(c.example?'<span class="ex-tag">مثال</span>':'')+'</span>'+
      (sub.length?'<span class="row-sub">'+sub.join('<span aria-hidden="true">·</span>')+'</span>':'')+
      (chips?'<span class="chips">'+chips+'</span>':'')+
    '</button>'+
    '<span class="row-end"><span class="pill '+d.cls+'">'+(d.text?'<span class="pill-l">'+d.label+'</span><span class="num">'+d.text+'</span>':d.label)+'</span>'+qa+'</span>'+
  '</div>';

function backupJSON(){
  return JSON.stringify({app:'newchem',format:1,exportedAt:new Date().toISOString(),
    customers:Object.keys(store.customers).filter(function(id){ return !store.customers[id].example; }).map(function(id){ return Object.assign({id:id},store.customers[id]); })});
}
function markBackup(msg){
  store.meta.lastBackup=Date.now(); save(); renderBanners(); if(!$('#menu').hidden) renderMenu(); toast(msg||'اتعملت النسخة الاحتياطية');
}
function downloadBackup(text,name){
  try{
    var blob=new Blob([text],{type:'application/json'}), u=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=u; a.download=name+'.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(u); },5000);
    markBackup('اتحفظت النسخة في التنزيلات (Downloads)');
  }catch(e){ toast('مقدرتش أحفظ النسخة على الجهاز ده.',true); }
}
function doBackup(){
  var real=S.list.filter(function(c){ return !c.example; }).length;
  if(!real){ toast('لسه مفيش عملاء تاخد لهم نسخة. الأمثلة مش بتتحفظ في النسخة.'); return; }
  var d=new Date(), name='newchem-backup-'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  var text=backupJSON(), files=null;
  try{
    if(navigator.share && navigator.canShare && typeof File==='function'){
      var fj=new File([text],name+'.json',{type:'application/json'});
      var ft=new File([text],name+'.txt',{type:'text/plain'});
      if(navigator.canShare({files:[fj]})) files=[fj]; else if(navigator.canShare({files:[ft]})) files=[ft];
    }
  }catch(e){ files=null; }
  if(files){
    navigator.share({files:files,title:'نسخة احتياطية - نيوكيم'}).then(function(){ markBackup(); },function(err){
      if(err && err.name==='AbortError') return;
      downloadBackup(text,name);
    });
    return;
  }
  downloadBackup(text,name);
}
function readImport(file){
  var fr=new FileReader();
  fr.onload=function(){
    var data=null;
    try{ data=JSON.parse(String(fr.result||'')); }catch(e){}
    var arr=data&&Array.isArray(data.customers)?data.customers:Array.isArray(data)?data:null;
    if(!arr){ toast('الملف ده مش نسخة احتياطية من نيوكيم.',true); return; }
    var clean=arr.filter(function(c){ return c && typeof c==='object' && String(c.name||'').trim(); });
    if(!clean.length){ toast('النسخة دي مفيهاش عملاء.',true); return; }
    S.importData=clean; if($('#menu').hidden) openMenu(); else renderMenu();
  };
  fr.onerror=function(){ toast('مقدرتش أقرا الملف.',true); };
  fr.readAsText(file);
}
function applyImport(mode){
  var arr=S.importData; if(!arr) return;
  var prev=store.customers, next=mode==='replace'?{}:Object.assign({},prev);
  arr.forEach(function(c){ var o=clone(c); var id=String(o.id||'')||newId(); delete o.id; o.example=false; if(!Array.isArray(o.products)) o.products=[]; if(!Array.isArray(o.history)) o.history=[]; next[id]=o; });
  store.customers=next;
  if(!save()){ store.customers=prev; return; }
  store.meta.seeded=true; save();
  S.importData=null; S.sel=null; askPersist(); refresh(); renderMenu();
  toast('اترجع '+arr.length+' عميل من النسخة');
}

    PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(function(v){ bioAvail=!!v; if(!$('#menu').hidden) renderMenu(); },function(){});
  }
}catch(e){}

function lockNow(){

function renderLock(msg){
  var n=lockCfg.len||4, h='';

  $('#lock-dots').innerHTML=h;

  $('#lock-sub').textContent=lockCfg.cred?'اكتب الرقم السري أو افتح '+bioWith():'اكتب الرقم السري';
  var wait=Math.ceil(((lockCfg.until||0)-Date.now())/1000);
  [].forEach.call(document.querySelectorAll('#pad .key'),function(k){ if(k.dataset.k!=='bio') k.disabled=wait>0; });

function keyIn(k){

function bioUnlock(auto){

    },function(e){

      if(r[1]!=='ok') delete lockCfg.cred;
      if(!lockSave()) return;
      closeLockset(); syncLockUI();
      toast(r[1]==='ok'?'القفل اشتغل بالرقم السري '+bioAnd():r[1]==='none'?'القفل اشتغل بالرقم السري':'القفل اشتغل بالرقم السري بس. '+bioLabel()+' ماتفعّلتش، وتقدر تجرّبها تاني من القائمة.');
    },function(){ btn.disabled=false; lsErr('حصلت مشكلة. جرّب تاني.'); });
    return;
  }
  var cur=cleanPin($('#ls-cur').value);
  if(!cur){ lsErr('اكتب الرقم السري الحالي.','ls-cur'); return; }
  var pin2=null;
  if(lockMode==='change'){ pin2=newPinOk(); if(!pin2) return; }
  btn.disabled=true;
  pinHash(cur, unb64(lockCfg.salt), lockCfg.iter||150000).then(function(h){
    if(h!==lockCfg.hash){ btn.disabled=false; lsErr('الرقم السري الحالي غلط.','ls-cur'); return; }
    if(lockMode==='off'){ lockCfg={after:lockCfg.after}; lockSave(); btn.disabled=false; closeLockset(); syncLockUI(); toast('القفل اتوقّف'); return; }
    return setPin(pin2).then(function(){ btn.disabled=false; if(lockSave()){ closeLockset(); toast('اتغيّر الرقم السري'); } });
  }).catch(function(){ btn.disabled=false; lsErr('حصلت مشكلة. جرّب تاني.'); });
});
$('#lock').addEventListener('click',function(e){
  var b=e.target.closest('[data-k]'); if(!b||b.disabled) return;
  var k=b.dataset.k;
  if(k==='bio') bioUnlock(false);
  else if(k==='forgot') showForgot();
  else if(k==='wipe') showForgot('wipe');
  else if(k==='wipe2') showForgot('wipe2');
  else if(k==='wipe-yes') wipeAll();
  else if(k==='forgot-close') $('#lock-forgot').hidden=true;
  else keyIn(k);
});
document.addEventListener('change',function(e){
  if(e.target && e.target.id==='lock-after'){ lockCfg.after=+e.target.value; if(lockSave()) toast('اتحفظ'); }
});
document.addEventListener('visibilitychange',function(){
  if(!lockCfg.enabled) return;
  if(document.visibilityState==='hidden'){ hiddenAt=Date.now(); if(!(lockCfg.after>0)) lockNow(); }
  else {
    if(!locked && hiddenAt && Date.now()-hiddenAt>=(lockCfg.after||0)*1000) lockNow();
    maybeAutoBio();
  }
});
window.addEventListener('pageshow',function(e){ if(e.persisted && lockCfg.enabled){ lockNow(); maybeAutoBio(); } });

/* ---------- start ---------- */
load();
if(!store.meta.seeded){ seedExamples(); store.meta.seeded=true; store.meta.firstRun=Date.now(); save(); }
lockLoad();
if(lockCfg.enabled && canLock){ lockNow(); maybeAutoBio(); } else root.classList.remove('locked');
syncLockUI();
refresh();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  var hadCtrl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',function(){ if(hadCtrl){ S.updateReady=true; renderBanners(); } hadCtrl=true; });
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') reg.update().catch(function(){}); });
    }).catch(function(){});
  });
}
})();
</script>
</body>
